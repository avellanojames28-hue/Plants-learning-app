plugins { id 'com.android.application' }
android {
    namespace 'com.sibol.plantparts'
    compileSdk 34
    defaultConfig {
        applicationId 'com.sibol.reads'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        // fixed key so every new build installs as an update over the last one
        debug { storeFile file('sibol.keystore'); storePassword 'sibol123'; keyAlias 'sibol'; keyPassword 'sibol123' }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
