<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Sibol Reads</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
/* Layout: one-screen school app — sky above, soil talk-bar below where Sibol speaks; each subject tints the accent */
:root{
  --sky:#E3F3FA; --sky-2:#C9E8F5; --paper:#FFFFFF;
  --leaf:#2F9E55; --leaf-deep:#1E6B3A; --leaf-soft:#DDF2E3;
  --sun:#FFC933; --sun-soft:#FFF1C2;
  --soil:#7A5034; --soil-2:#A9744C;
  --berry:#E8484F; --sky-ink:#2D78B8;
  --ink:#183126; --muted:#56705F; --line:#BFD9CB;
  --sc:#2F9E55; --sc-deep:#1E6B3A; --sc-soft:#DDF2E3;
  --display:"Grandstander","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  --r:22px;
  color-scheme:light;
}
body[data-subj="fil"]{--sc:#2456B8;--sc-deep:#183C82;--sc-soft:#E0EAFB}
body[data-subj="cl"]{--sc:#8A4FBF;--sc-deep:#5E3290;--sc-soft:#F0E6FA}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--sky-ink);outline-offset:3px}
#app{max-width:980px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}

/* top bar */
.bar{display:flex;align-items:center;gap:10px}
.bar .tt{flex:1;min-width:0}
.bar h2{font-size:clamp(21px,5.2vw,30px);color:var(--sc-deep)}
.bar small{display:block;font-family:var(--display);font-weight:600;color:var(--muted);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.round{width:50px;height:50px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 3px 0 var(--line);flex:none}
.round svg{width:25px;height:25px}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.howto{font-size:17px;color:var(--muted);margin-top:-4px}
.langt{font-family:var(--display);font-weight:800;font-size:15px;height:50px;padding:0 12px;border-radius:999px;background:var(--paper);box-shadow:0 3px 0 var(--line);flex:none;display:inline-flex;gap:2px;align-items:center}
.langt span{padding:4px 8px;border-radius:999px;color:var(--muted)}
.langt span.on{background:var(--sc);color:#fff}
.hearts{display:flex;gap:1px;flex:none}
.exrow{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;color:var(--muted);margin-top:-6px}
.hearts .heart svg{width:30px;height:30px;display:block}
.heart.lost{opacity:.25;filter:grayscale(1)}
.heart.break{animation:hb .7s}
@keyframes hb{30%{transform:scale(1.5) rotate(-12deg)}60%{transform:scale(.8) rotate(10deg)}}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding-top:6px}
.hero h1{font-size:clamp(36px,10vw,62px);color:var(--leaf-deep);font-weight:800}
.hero h1 span{color:var(--berry)}
.hero p{color:var(--muted);max-width:32ch;margin-top:4px}
.hero .big-sibol{width:clamp(100px,26vw,170px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{background:var(--paper);border-radius:999px;padding:8px 16px;box-shadow:0 3px 0 var(--line);font-weight:700;display:inline-flex;gap:8px;align-items:center}
.pill svg{width:22px;height:22px}
.pill[aria-pressed="false"]{opacity:.6}
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.subj{font-family:var(--display);font-weight:800;font-size:clamp(15px,4.2vw,20px);padding:12px 6px;border-radius:18px;background:var(--paper);box-shadow:0 3px 0 var(--line);display:grid;justify-items:center;gap:4px;line-height:1.05}
.subj svg{width:34px;height:34px}
.subj[aria-selected="true"]{background:var(--sc);color:#fff;box-shadow:0 4px 0 var(--sc-deep)}
.lessons{display:grid;gap:12px}
@media (min-width:760px){.lessons{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lcard{background:var(--paper);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;box-shadow:0 3px 0 var(--line);align-content:start}
.lcard h3{font-size:23px;color:var(--ink)}
.lcard .sub{color:var(--muted);font-size:15px;margin-top:2px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:15px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--sc-soft);color:var(--sc-deep);font-weight:700}
.badge.lock{background:#EEF2EF;color:var(--muted)}
.lbtns{display:flex;gap:10px;flex-wrap:wrap}
.lbtn{font-family:var(--display);font-weight:800;font-size:19px;padding:10px 18px;border-radius:999px;background:var(--sc);color:#fff;box-shadow:0 4px 0 var(--sc-deep);display:inline-flex;gap:8px;align-items:center}
.lbtn svg{width:20px;height:20px}
.lbtn.alt{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #D9A400}
.lbtn[disabled]{background:#E4EBE7;color:#8CA096;box-shadow:0 4px 0 #CAD7CF;cursor:default}
.lbtn:not([disabled]):active{transform:translateY(3px);box-shadow:0 1px 0 var(--sc-deep)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:22px;height:22px}
.tips{background:var(--sun-soft);border-radius:var(--r);padding:12px 16px;font-size:16px}
.tips h3{font-size:19px;margin-bottom:4px}
.tips ul{margin:0;padding-left:20px}

/* learn: plant */
.learn{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.learn{grid-template-columns:1.1fr 1fr;align-items:start}}
.plantbox{background:linear-gradient(var(--paper) 70%,var(--sky-2));border-radius:var(--r);padding:8px}
.plantbox svg{display:block;width:100%;max-height:50vh}
.part{cursor:pointer;transition:opacity .25s,filter .25s}
.dim .part{opacity:.35}
.dim .part.on{opacity:1;filter:drop-shadow(0 0 6px var(--sun)) drop-shadow(0 0 10px var(--sun))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-weight:600;font-size:19px;padding:8px 14px;border-radius:999px;background:var(--paper);box-shadow:0 3px 0 var(--line);display:inline-flex;gap:6px;align-items:center}
.chip.seen{background:var(--leaf-soft)}
.chip.on{background:var(--sun);box-shadow:0 3px 0 #D9A400}
.fact{background:var(--paper);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center;min-height:140px}
.fact svg{width:110px;height:92px}
.fact h3{font-size:26px;color:var(--berry)}
.fact p{margin-top:4px;font-size:19px}
.fact.empty{grid-template-columns:1fr;color:var(--muted);text-align:center;place-items:center}

/* boards */
.board{position:relative;touch-action:none;background:var(--paper);border-radius:var(--r);padding:14px}
canvas.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.match{display:grid;grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr);row-gap:12px;align-items:center}
.match .cell{display:flex;align-items:center;gap:10px;min-height:88px}
.match .L{justify-content:flex-end;text-align:right}
.phrase{font-size:clamp(17px,4.4vw,22px);font-weight:700;line-height:1.25}
.bigword{font-family:var(--display);font-size:clamp(22px,6vw,32px);font-weight:600}
.pic{width:clamp(80px,22vw,120px);aspect-ratio:6/5;max-width:100%;display:block}
.pic svg{width:100%;height:100%;display:block}
.dot{width:26px;height:26px;border-radius:50%;background:var(--ink);flex:none;box-shadow:0 0 0 6px var(--sun-soft);transition:transform .2s}
.dot.active{transform:scale(1.3);background:var(--sky-ink)}
.dot.used{background:var(--leaf)}
.dot.hit{animation:wob .45s}
.label-board{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center}
.words{display:grid;gap:clamp(26px,7vh,58px)}
.word{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:clamp(22px,5.6vw,30px);font-weight:600}
.tplant{position:relative}
.tplant svg{display:block;width:100%;max-height:62vh}
.tplant .dot{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;background:var(--paper);border:5px solid var(--ink);box-shadow:0 0 0 4px rgba(255,201,51,.7)}
.tplant .dot.active{transform:translate(-50%,-50%) scale(1.3);border-color:var(--sky-ink)}
.tplant .dot.used{border-color:var(--leaf);background:var(--leaf)}
.tplant .dot.hit{animation:wob2 .45s}
.circle-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.circle-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{border:3px dashed var(--line);border-radius:18px;padding:6px 4px;display:grid;gap:6px;justify-items:center}
.pcard.done{border-style:solid;border-color:var(--leaf);background:var(--leaf-soft)}
.pcard .pic{width:min(100%,150px)}
.choices{display:flex;justify-content:space-between;gap:2px;width:100%}
.choice{font-size:clamp(15px,4vw,23px);font-weight:700;padding:4px 6px;border-radius:50%;border:4px solid transparent}
.choice.circled{border-color:var(--berry);border-radius:50% 46% 52% 48%}
.choice.no{animation:wob .45s;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pgrid .choice{border-radius:22px;padding:4px;display:block}
.pgrid .choice .pic{width:100%}
.oddrows{display:grid;gap:10px}
.oddrow{display:grid;grid-template-columns:30px repeat(4,minmax(0,1fr));align-items:center;justify-items:center;border-bottom:2px dashed var(--line);padding-bottom:8px}
.oddrow b{font-family:var(--display);color:var(--muted)}
.oddrow .choice{font-family:var(--display);font-size:clamp(24px,7vw,34px);padding:2px 14px}

.qcard{display:grid;gap:12px}
.qline{display:flex;gap:10px;align-items:center}
.qline h3{font-size:clamp(21px,5.4vw,28px);flex:1;min-width:0}
.qnum{font-family:var(--display);font-weight:800;color:var(--muted);font-size:18px}
.cpics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cpic{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:18px;aspect-ratio:6/5;max-width:100%;touch-action:none;overflow:hidden}
.cpic canvas,.bubble canvas{position:absolute;inset:0;width:100%;height:100%}
.cpic svg{position:absolute;inset:6%;width:88%;height:88%;pointer-events:none}
.cpic.right{border-color:var(--leaf);box-shadow:0 0 0 5px var(--leaf-soft)}
.cpic.wrong,.bubble.wrong{animation:wob .45s;border-color:var(--berry)}
.crayons{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.crayon{width:44px;height:44px;border-radius:50%;border:4px solid var(--paper);box-shadow:0 0 0 2px var(--line)}
.crayon[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink);transform:scale(1.1)}
.eraser{background:var(--paper);display:grid;place-items:center}
.eraser svg{width:24px;height:24px}
.bubble{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);position:relative;overflow:hidden;touch-action:none;flex:none;background:var(--paper)}
.bubble.right{border-color:var(--leaf);box-shadow:0 0 0 4px var(--leaf-soft)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;border-bottom:2px dashed var(--line);padding-block:8px}
.prow .pic{width:min(100%,150px)}
.popts{display:grid;gap:10px}
.popt{display:flex;gap:10px;align-items:center;font-size:clamp(17px,4.6vw,22px);font-weight:700}

.next{font-family:var(--display);font-weight:800;font-size:22px;background:var(--sc);color:#fff;border-radius:999px;padding:12px 26px;box-shadow:0 4px 0 var(--sc-deep)}
.next[disabled]{background:var(--line);box-shadow:0 4px 0 #a6c4b4;color:var(--paper);cursor:default}
.next:not([disabled]){animation:pulse 1.6s infinite}

/* filipino */
.lettercard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--paper);border-radius:var(--r);padding:14px}
.biglet{font-family:var(--display);font-weight:800;font-size:clamp(56px,16vw,90px);color:var(--sc);background:var(--sc-soft);border-radius:20px;padding:0 18px;line-height:1.2}
.story{background:var(--paper);border-radius:var(--r);padding:16px;font-size:clamp(20px,5.4vw,26px);line-height:1.7}
.story .w{border-radius:8px;padding:0 2px;cursor:pointer}
.story .w.found{background:var(--sun);box-shadow:0 2px 0 #D9A400}
.story .w.miss{animation:wob .45s}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.wcard{background:var(--paper);border-radius:18px;padding:8px;display:grid;justify-items:center;gap:2px;box-shadow:0 3px 0 var(--line);border:3px solid transparent}
.wcard .pic{width:100%}
.wcard b{font-family:var(--display);font-size:21px;font-weight:600}
.wcard.seen{border-color:var(--sc);background:var(--sc-soft)}
.qa{background:var(--paper);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.qa h3{font-size:clamp(20px,5.2vw,26px)}
.cbtns{display:flex;gap:10px;flex-wrap:wrap}
.cbtn{background:var(--paper);border-radius:16px;padding:10px 18px;font-weight:700;font-size:20px;box-shadow:0 3px 0 var(--line);border:3px solid var(--line)}
.cbtn.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.cbtn.no{animation:wob .45s;border-color:var(--berry)}
.sylbuild{background:var(--paper);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.sylbuild .biglet{font-size:clamp(50px,14vw,80px)}
.vow{display:grid;gap:8px}
.vrow{display:flex;gap:12px;align-items:center}
.vbtn{width:52px;height:52px;border-radius:50%;background:var(--sun);font-family:var(--display);font-weight:800;font-size:26px;box-shadow:0 3px 0 #D9A400}
.vout{font-family:var(--display);font-size:30px;font-weight:800;color:var(--sc);min-width:60px;border-bottom:3px solid var(--line);text-align:center}
.sylgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;background:var(--paper);border-radius:var(--r);padding:12px}
.syl{font-family:var(--display);font-size:clamp(24px,7vw,34px);font-weight:600;padding:6px 0;border-radius:14px;background:var(--sky)}
.syl.seen{background:var(--sc-soft);color:var(--sc-deep)}
.sent{background:var(--paper);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;border:3px solid transparent}
.sent.seen{border-color:var(--sc)}
.sent .pic{width:110px}
.sent p{font-size:clamp(20px,5.2vw,26px);font-weight:700}
.sent .w{cursor:pointer;border-radius:6px}
.fill{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fcard{background:var(--paper);border-radius:18px;padding:8px;display:grid;justify-items:center;gap:6px;border:3px solid var(--line)}
.fcard.done{border-color:var(--leaf);background:var(--leaf-soft)}
.fcard .pic{width:min(100%,130px)}
.fword{font-family:var(--display);font-size:clamp(22px,6vw,30px);font-weight:600}
.fword i{font-style:normal;display:inline-block;min-width:2.1em;border-bottom:3px solid var(--ink);text-align:center;color:var(--sc)}
.sbtns{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.sbtn{font-family:var(--display);font-weight:800;font-size:19px;width:42px;height:42px;border-radius:12px;background:var(--sun-soft);box-shadow:0 2px 0 #E7C55A}
.sbtn.no{animation:wob .45s;background:#FBD3D4}

/* story player */
.stage{position:relative;background:var(--paper);border-radius:var(--r);overflow:hidden;touch-action:manipulation}
.stage svg{display:block;width:100%;height:auto}
.narr{background:var(--paper);border-radius:var(--r);padding:12px 16px;font-size:clamp(18px,4.8vw,23px);min-height:3.2em}
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sc)}
.dots i.done{background:var(--sc-soft);box-shadow:inset 0 0 0 2px var(--sc)}
.tap{cursor:pointer}
.hint{animation:glow 1.1s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 5px #FFC933) drop-shadow(0 0 3px #FFB000)}}
.prompt{font-family:var(--display);font-weight:800;font-size:20px;color:var(--sc-deep);background:var(--sun-soft);border-radius:16px;padding:8px 14px}
.walkin{animation:walkin 3.2s ease-out both}
@keyframes walkin{from{transform:translateX(var(--fx,-160px))}to{transform:translateX(0)}}
.walkout{animation:walkout 3.6s ease-in both}
@keyframes walkout{from{transform:translateX(0)}to{transform:translateX(var(--tx,320px))}}
.bob .pb{animation:bob2 .32s ease-in-out infinite alternate}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(26px)}}
@keyframes bob2{to{transform:translateY(-5px)}}
.float{animation:flt 2.4s ease-in-out infinite alternate}
@keyframes flt{to{transform:translateY(-6px)}}
.pop{animation:popin .5s cubic-bezier(.3,1.6,.6,1) both}
@keyframes popin{from{transform:scale(0);opacity:0}}
.pop,.float,.spin{transform-box:fill-box;transform-origin:center}
.fly{animation:fly 1s ease-in both}
.sparkle{animation:spk 1.2s ease-out both}
@keyframes spk{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.6)}}

/* verse */
.verse{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.verse{grid-template-columns:1fr 1.1fr;align-items:start}}
.kidstage{background:linear-gradient(var(--paper),var(--sc-soft));border-radius:var(--r);padding:6px}
.kidstage svg{display:block;width:100%;max-height:38vh}
.vlines{display:grid;gap:6px}
.vline{text-align:left;background:var(--paper);border-radius:14px;padding:8px 12px;font-size:clamp(19px,5vw,24px);font-weight:700;box-shadow:0 2px 0 var(--line);line-height:1.3}
.vline.on{background:var(--sun);box-shadow:0 2px 0 #D9A400}
.vline .ref{color:var(--sc-deep)}
.hidew .vline .w{color:transparent;border-bottom:3px dotted var(--muted);border-radius:0}
.somew .vline .w.k{color:transparent;border-bottom:3px dotted var(--muted);border-radius:0}
.vline.on .w{color:inherit!important;border:0!important}
.seg{display:inline-flex;background:var(--paper);border-radius:999px;box-shadow:0 3px 0 var(--line);padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:16px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sc);color:#fff}
.mgame{background:var(--paper);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.mtext{font-size:clamp(19px,5vw,24px);font-weight:700;line-height:1.7}
.mtext .blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--ink);text-align:center;color:var(--sc)}
.mtext .blank.cur{background:var(--sun-soft)}
.mchips{display:flex;gap:8px;flex-wrap:wrap}
.mchip{font-family:var(--display);font-weight:600;font-size:20px;padding:6px 14px;border-radius:999px;background:var(--sc-soft);color:var(--sc-deep);box-shadow:0 2px 0 var(--line)}
.mchip.no{animation:wob .45s;background:#FBD3D4}
.mchip[disabled]{opacity:.25}
#kid .mouth-open{opacity:0}
.talking #kid .mouth-open{animation:mouth .28s infinite alternate}
@keyframes mouth{to{opacity:1}}

/* finish + overlay */
.win{background:var(--paper);border-radius:var(--r);padding:22px;text-align:center;display:grid;gap:10px;justify-items:center}
.win h2{font-size:clamp(30px,8vw,46px);color:var(--berry)}
.win .stars svg{width:44px;height:44px}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(24,49,38,.55);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--paper);border-radius:28px;padding:24px 20px;max-width:440px;text-align:center;display:grid;gap:12px;justify-items:center;animation:popin .5s cubic-bezier(.3,1.6,.6,1) both}
.dialog svg.sb{width:120px}
.dialog h2{font-size:clamp(26px,7vw,36px);color:var(--sc-deep)}
.dialog p{font-size:19px}

/* talk bar */
.talk{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--soil);color:#FFF7EA;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:12px;align-items:center;min-height:84px;box-shadow:0 -6px 0 var(--soil-2)}
.talk .sib{width:62px;height:62px;flex:none}
.talk p{font-size:clamp(16px,4.2vw,20px);line-height:1.3;flex:1;min-width:0}
.talk .round{background:#FFF7EA}
.talking .talk .sib{animation:bob .5s infinite alternate}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
[data-say].hover,[data-fil].hover{outline:3px dashed var(--sky-ink);outline-offset:4px;border-radius:12px}

@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes wob2{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 7px),-50%)}75%{transform:translate(calc(-50% + 7px),-50%)}}
@keyframes bob{to{transform:translateY(-6px) rotate(-4deg)}}
@keyframes pulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Sibol Reads: adventure-trail layout; islands tint the trail; big touch targets for small hands */
:root{--isl:#2F9E55;--isl-soft:#DDF2E3}
.langt{display:none!important}
.rhead{display:flex;align-items:center;gap:10px;padding-top:6px}
.rhead h1{font-size:clamp(30px,8.6vw,48px);color:var(--leaf-deep);flex:1;min-width:0}
.rhead h1 span{color:var(--berry)}
.rhead .big-sibol{width:72px}
.topbtns{display:flex;gap:10px;flex-wrap:wrap}
.stickbtn{font-family:var(--display);font-weight:800;font-size:18px;background:var(--sun);border-radius:999px;padding:10px 16px;box-shadow:0 4px 0 #D9A400;display:inline-flex;gap:8px;align-items:center}
.stickbtn b{background:#fff;border-radius:999px;padding:0 8px;font-size:16px}
.grown{font-size:14px;color:var(--muted);background:var(--paper);border-radius:999px;padding:10px 14px;box-shadow:0 3px 0 var(--line);font-weight:700;touch-action:none}
.grown.hold{background:var(--sun-soft)}
.trail{position:relative;display:grid;gap:4px;padding-block:10px 30px}
.trail svg.road{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.isle{position:relative;z-index:1;margin:18px 0 6px;background:var(--isl);color:#fff;border-radius:20px;padding:10px 16px;font-family:var(--display);font-weight:800;font-size:20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.isle small{font-family:var(--body);font-weight:700;font-size:16px;letter-spacing:.12em;opacity:.95}
.nrow{position:relative;z-index:1;height:96px;display:flex;align-items:center}
.node{position:absolute;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;background:var(--paper);border:5px solid var(--isl);box-shadow:0 6px 0 rgba(0,0,0,.15);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:34px;color:var(--isl)}
.node .ic{font-size:30px;line-height:1}
.node.done{background:var(--isl);color:#fff}
.node.done::after{content:"★";position:absolute;right:-8px;top:-8px;width:28px;height:28px;border-radius:50%;background:var(--sun);color:#7A5300;font-size:18px;display:grid;place-items:center;box-shadow:0 2px 0 #D9A400}
.node.locked{border-color:#C9D6CE;color:#B5C4BB;background:#EEF3F0;box-shadow:0 6px 0 #D5E0DA}
.node.cur{animation:nodepulse 1.4s infinite}
@keyframes nodepulse{50%{transform:translateX(-50%) scale(1.1);box-shadow:0 0 0 10px rgba(255,201,51,.45),0 6px 0 rgba(0,0,0,.15)}}
.node .lbl{position:absolute;top:100%;margin-top:8px;font-family:var(--body);font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;background:rgba(255,255,255,.85);border-radius:999px;padding:0 8px}
.node .me{position:absolute;width:56px;left:84%;top:-38px;pointer-events:none}
.ptip{background:var(--paper);border-radius:var(--r);padding:12px 16px;font-size:16px;color:var(--muted)}

/* activity shell */
.ashell{display:flex;align-items:center;gap:10px}
.prog{flex:1;display:flex;gap:6px}
.prog i{flex:1;height:16px;border-radius:999px;background:#DDE8E2}
.prog i.on{background:var(--isl)}
.prog i.cur{background:linear-gradient(90deg,var(--isl) 40%,#DDE8E2 40%)}
.atitle{font-family:var(--display);font-weight:800;font-size:clamp(22px,6vw,32px);color:var(--ink);text-align:center}
.bigbtn{font-family:var(--display);font-weight:800;font-size:24px;background:var(--isl);color:#fff;border-radius:999px;padding:14px 30px;box-shadow:0 5px 0 rgba(0,0,0,.2);justify-self:center}
.bigbtn[disabled]{background:#D5E0DA;box-shadow:0 5px 0 #C2D1C8;color:#fff}
.bigbtn:not([disabled]){animation:pulse 1.6s infinite}
.center{display:grid;gap:16px;justify-items:center;text-align:center}

/* meet */
.meet{background:var(--paper);border-radius:28px;padding:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:center;width:100%;box-shadow:0 4px 0 var(--line)}
.bigL{font-family:var(--display);font-weight:800;font-size:clamp(90px,28vw,150px);line-height:1;color:var(--isl);animation:popin .6s cubic-bezier(.3,1.6,.6,1) both;background:var(--isl-soft);border-radius:24px;padding:10px 0}
.pic1{display:grid;justify-items:center;gap:4px;border-radius:24px;padding:10px 0}
.emo{font-size:clamp(70px,22vw,110px);line-height:1.1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.kw{font-family:var(--display);font-size:clamp(28px,8vw,40px);font-weight:600}
.kw b{color:var(--berry)}
.taps{display:flex;gap:8px}
.taps i{width:22px;height:22px;border-radius:50%;background:#DDE8E2}
.taps i.on{background:var(--sun);box-shadow:0 2px 0 #D9A400}

/* tracer */
.tracer{position:relative;width:min(100%,46vh,360px);aspect-ratio:100/140;touch-action:none;background:#fff;border-radius:24px;box-shadow:0 4px 0 var(--line);justify-self:center}
.tracer svg{position:absolute;inset:0;width:100%;height:100%}
.tracer canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tracer.small{width:min(30vw,130px)}
.wordtrace{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* choose cards */
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.pcard3{background:var(--paper);border-radius:24px;padding:12px 4px;box-shadow:0 4px 0 var(--line);display:grid;justify-items:center;gap:2px;border:4px solid transparent}
.pcard3 .emo{font-size:clamp(54px,17vw,90px)}
.pcard3 span{font-family:var(--display);font-size:20px;font-weight:600}
.pcard3.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.pcard3.no{animation:wob .45s;opacity:.6}
.pcard3.hintme{animation:glow 1s infinite;border-color:var(--sun)}
.saybig{width:86px;height:86px;border-radius:50%;background:var(--sun);display:grid;place-items:center;box-shadow:0 5px 0 #D9A400}
.saybig svg{width:44px;height:44px}

/* balloons */
.popzone{position:relative;height:min(58vh,520px);background:linear-gradient(#BFE6F7,#E6F6FC);border-radius:24px;overflow:hidden;touch-action:none;width:100%}
.balloon{position:absolute;bottom:-150px;width:84px;height:104px;border-radius:50% 50% 48% 48%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px;color:#fff;animation:rise linear forwards;box-shadow:inset -10px -12px 0 rgba(0,0,0,.12)}
.balloon::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:44px;background:#8A9A92}
.balloon.popped{animation:popb .3s ease-out forwards!important}
.balloon.nope{filter:grayscale(.6)}
@keyframes rise{to{transform:translateY(calc(-1 * (min(58vh,520px) + 260px)))}}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.score{font-family:var(--display);font-weight:800;font-size:22px;display:flex;gap:6px;align-items:center}

/* blending + spelling */
.tiles{display:flex;gap:10px;justify-content:center}
.tile{width:clamp(70px,21vw,96px);height:clamp(84px,25vw,112px);border-radius:20px;background:var(--paper);box-shadow:0 5px 0 var(--line);font-family:var(--display);font-weight:800;font-size:clamp(48px,14vw,66px);color:var(--ink);display:grid;place-items:center;border:4px solid transparent}
.tile.heard{border-color:var(--isl);color:var(--isl)}
.tile.glow{background:var(--sun-soft);border-color:var(--sun);transform:translateY(-6px);transition:transform .15s}
.slots{display:flex;gap:10px;justify-content:center}
.slot{width:clamp(66px,19vw,90px);height:clamp(78px,23vw,104px);border-radius:18px;border:4px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,60px);color:var(--isl);background:#fff}
.slot.cur{border-color:var(--sun);background:var(--sun-soft)}
.slot.full{border-style:solid;border-color:var(--isl)}
.ltiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ltile{width:64px;height:72px;border-radius:16px;background:var(--sun);box-shadow:0 4px 0 #D9A400;font-family:var(--display);font-weight:800;font-size:40px}
.ltile.no{animation:wob .45s;background:#FBD3D4;box-shadow:0 4px 0 #E8A3A6}
.ltile.hintme{animation:glow 1s infinite}
.ltile[disabled]{opacity:.25}
.slider{position:relative;height:64px;width:min(100%,420px);border-radius:999px;background:var(--isl-soft);touch-action:none;justify-self:center}
.slider .knob{position:absolute;left:4px;top:4px;width:56px;height:56px;border-radius:50%;background:var(--isl);display:grid;place-items:center;color:#fff;font-size:28px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.slider span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--muted);pointer-events:none}

/* sight + sentences */
.wordgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.wbtn{font-family:var(--display);font-size:clamp(26px,7.5vw,38px);font-weight:600;background:var(--paper);border-radius:20px;padding:14px 0;box-shadow:0 4px 0 var(--line);border:4px solid transparent}
.wbtn.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.wbtn.no{animation:wob .45s}
.sentbox{background:var(--paper);border-radius:24px;padding:18px;box-shadow:0 4px 0 var(--line);font-family:var(--display);font-weight:600;font-size:clamp(30px,8.6vw,46px);line-height:1.4;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;width:100%}
.sentbox .sw{border-radius:12px;padding:0 6px}
.sentbox .sw.on{background:var(--sun)}
.sentbox .sw.heard{color:var(--isl)}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.cards2 .pcard3 .emo{font-size:clamp(46px,13vw,70px);letter-spacing:4px}

/* reward + stickers */
.reward{display:grid;gap:14px;justify-items:center;text-align:center;padding-top:20px}
.reward h2{font-size:clamp(34px,10vw,54px);color:var(--berry)}
.scard{width:min(60vw,240px);aspect-ratio:1;perspective:800px;cursor:pointer}
.scard .in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,1.4,.6,1);transform-style:preserve-3d}
.scard.flip .in{transform:rotateY(180deg)}
.scard .f,.scard .b{position:absolute;inset:0;border-radius:28px;display:grid;place-items:center;backface-visibility:hidden;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.scard .f{background:repeating-linear-gradient(45deg,var(--sun) 0 18px,#FFD75E 18px 36px);font-family:var(--display);font-weight:800;font-size:80px;color:#fff}
.scard .b{background:#fff;transform:rotateY(180deg);font-size:min(36vw,140px)}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.book div{aspect-ratio:1;border-radius:20px;background:var(--paper);display:grid;place-items:center;font-size:44px;box-shadow:0 3px 0 var(--line)}
.book div.empty{background:#EEF3F0;color:#C3D0C8;font-family:var(--display);font-weight:800;font-size:28px;box-shadow:none;border:3px dashed #D5E0DA}
.gpanel{display:grid;gap:12px}
.gpanel .card{background:var(--paper);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.dance{animation:dance .6s ease-in-out infinite alternate;transform-origin:50% 90%}
@keyframes dance{from{transform:rotate(-8deg)}to{transform:rotate(8deg) translateY(-6px)}}

</style>

</div>
<script>
/* ============ art: all drawings are original SVG ============ */
const INK='#183126';
const svg=(vb,inner,cls='')=>`<svg viewBox="${vb}" class="${cls}" aria-hidden="true">${inner}</svg>`;
const at=(x,y,s,inner)=>`<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;

/* --- plants (science) --- */
const leaf=(x,y,r,s=1,f='#2F9E55',v='#1E6B3A')=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M0 0C10-12 34-14 48 0C34 14 10 12 0 0Z" fill="${f}"/><path d="M3 0H43" stroke="${v}" stroke-width="1.6" fill="none"/></g>`;
const jleaf=(x,y,r,s=1)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M0 0C4-8 10-12 14-12L16-17 20-12 26-15 28-10 34-12 35-6 41-6 39-1 46 0 39 2 41 7 35 7 34 12 28 10 26 15 20 12 16 17 14 12C10 12 4 8 0 0Z" fill="#3A9A4E"/><path d="M2 0H40M16 0 22-8M24 0 30 8M16 0 22 8M24 0 30-8" stroke="#1E6B3A" stroke-width="1.5" fill="none"/></g>`;
const flower=(x,y,s=1,petal='#fff',mid='#F4C430')=>{let p='';for(let i=0;i<5;i++)p+=`<ellipse cx="0" cy="-11" rx="7" ry="11" fill="${petal}" stroke="#D3DCD6" stroke-width="1" transform="rotate(${i*72})"/>`;return `<g transform="translate(${x} ${y}) scale(${s})">${p}<circle r="5.5" fill="${mid}"/><circle r="2" fill="#B98A00"/></g>`};
const star=(x,y,s=1)=>{let p='';for(let i=0;i<5;i++)p+=`<path d="M0 0L-4-12 0-16 4-12Z" fill="#F7C51E" transform="rotate(${i*72})"/>`;return `<g transform="translate(${x} ${y}) scale(${s})">${p}<circle r="3" fill="#E79A00"/></g>`};
const chili=(x,y,r=0,s=1)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M0 2C7 6 8 22 4 44 3 50-1 52-2 47-4 30-7 10 0 2Z" fill="#D7372F"/><path d="M-1 8C0 18 0 30-1 40" stroke="#F07A6E" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M-4 3C-2-1 3-1 5 3 2 6-1 6-4 3Z" fill="#2F7D3F"/><path d="M0 0V-9" stroke="#2F7D3F" stroke-width="2.2" stroke-linecap="round"/></g>`;
const tomato=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><ellipse rx="22" ry="19" fill="#C9473F"/><ellipse cx="-7" cy="-6" rx="6" ry="4" fill="#E3786E"/><path d="M0-17 L-8-22 -3-16 -12-14 -2-13 -6-6 0-12 6-6 2-13 12-14 3-16 8-22Z" fill="#3A8A3F"/></g>`;
const berry=(x,y,s=1)=>{let d='';[[-8,-6],[0,-8],[8,-6],[-10,4],[-2,2],[6,4],[12,-2],[-4,13],[4,14],[0,22]].forEach(([a,b])=>d+=`<ellipse cx="${a}" cy="${b}" rx="1.4" ry="2" fill="#FFE07A"/>`);return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0-16C18-20 26-4 18 12 12 24 4 30 0 32-4 30-12 24-18 12-26-4-18-20 0-16Z" fill="#D9363E"/>${d}<path d="M0-16 L-14-24 -5-17 -12-12 0-15 12-12 5-17 14-24Z" fill="#2E8B45"/></g>`};
const roots=(c='#6B4A2F')=>`<g stroke="${c}" fill="none" stroke-linecap="round"><path d="M0 0C-1 18-6 30-16 44" stroke-width="3"/><path d="M0 0C3 20 10 32 22 44" stroke-width="3"/><path d="M0 4C-14 10-30 14-44 22" stroke-width="2.6"/><path d="M0 5C16 10 32 14 46 20" stroke-width="2.6"/><path d="M-8 26-20 30M-30 16-36 26M14 28 26 30M30 15 36 25M-12 38-22 40M18 38 12 48M-40 20-48 18M40 18 48 24" stroke-width="1.6"/></g>`;

const ILL={
  leaves:()=>svg('0 0 120 100',`<path d="M60 98V50" stroke="#2F9E55" stroke-width="5" stroke-linecap="round"/>${leaf(60,56,-150,1.05)}${leaf(60,56,-30,1.05)}${leaf(60,52,-90,1.15)}`),
  stem:()=>svg('0 0 120 100',`<rect x="10" y="86" width="100" height="14" rx="6" fill="#A9744C"/><path d="M60 88C59 60 61 34 60 8" stroke="#9A7B4F" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M60 40 74 28M60 58 46 48M60 22 52 14" stroke="#9A7B4F" stroke-width="3.5" stroke-linecap="round"/>${leaf(74,28,-40,.38)}${leaf(46,48,-150,.38)}${leaf(52,14,-130,.32)}`),
  roots:()=>svg('0 0 120 100',`<path d="M6 30H114A54 64 0 0 1 6 30Z" fill="#B98258"/><path d="M60 31V6" stroke="#2F9E55" stroke-width="5" stroke-linecap="round"/><g transform="translate(60 31)">${roots('#5A3A22')}</g>`),
  flower:()=>svg('0 0 120 100',flower(60,52,2.6)),
  fruit:()=>svg('0 0 120 100',`<path d="M40 4C44 20 50 26 58 30M80 4C78 18 72 24 66 30" stroke="#2F7D3F" stroke-width="3" fill="none"/>${chili(56,28,6,1.25)}${chili(70,28,-8,1.1).replace(/#D7372F/,'#3E9B4B').replace(/#F07A6E/,'#7BC67F')}`),
  seeds:()=>svg('0 0 120 100',`${[16,44,72,100].map((x,i)=>`<g transform="translate(${x} 46)">${i?`<path d="${['','M-2 8C-6 14-2 18 4 18','M-4 8C-12 16-10 26 2 28','M0 8C-6 22 4 34 14 40'][i]}" stroke="#7FB069" stroke-width="3.2" fill="none" stroke-linecap="round"/>`:''}<ellipse rx="10" ry="9" fill="#F2D16B"/><ellipse cx="-3" cy="-3" rx="3.5" ry="2.5" fill="#FFF3C4"/></g>`).join('')}`),
  seedsPile:()=>svg('0 0 120 100',[[42,40],[64,34],[86,42],[50,62],[74,60],[62,82]].map(([x,y],i)=>`<g transform="translate(${x} ${y}) rotate(${i*35})"><ellipse rx="11" ry="8" fill="#5E8C3A"/><ellipse cx="4" rx="3.5" ry="2" fill="#2E4A1C"/></g>`).join('')),
  bigLeaf:()=>svg('0 0 120 100',`${jleaf(60,92,-90,1.8)}${jleaf(62,70,-35,1.05)}${jleaf(58,70,-145,1.05)}`),
  tomato:()=>svg('0 0 120 100',tomato(60,54,2)),
  strawberries:()=>svg('0 0 120 100',berry(42,46,1.25)+berry(80,52,1.3)),

const SK=['#E9B98F','#C98D63','#D9A47A'];
function person(o){
  const {x,y,s=1,robe='#7DA9D8',skin=SK[0],hair='#3B2A1E',cloth=null,beard=false,flip=false,arms='down',cls='',face='smile',sash=null,kid=false,id=''}=o;

    :face==='hurt'?`<path d="M-9 ${hy-2}c2 2 4 2 6 0M3 ${hy-2}c2 2 4 2 6 0" stroke="#222" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M-4 ${hy+9}c3-3 6-3 8 0" stroke="#222" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M-12 ${hy-8}l6 3" stroke="#E0565B" stroke-width="2.5" stroke-linecap="round"/>`
    :`<circle cx="-5.5" cy="${hy-2}" r="2.2" fill="#222"/><circle cx="5.5" cy="${hy-2}" r="2.2" fill="#222"/><path d="M-5 ${hy+7}c3 4 7 4 10 0" stroke="#222" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  const cheeks=`<circle cx="-10" cy="${hy+5}" r="3.2" fill="#F49A9A" opacity=".75"/><circle cx="10" cy="${hy+5}" r="3.2" fill="#F49A9A" opacity=".75"/>`;
  const head=cloth?`<path d="M-19 ${hy}C-20 ${hy-26} 20 ${hy-26} 19 ${hy}L21 ${hy+20}H-21Z" fill="${cloth}" ${OL}/><circle cx="0" cy="${hy}" r="15" fill="${skin}" ${OL}/><path d="M-16 ${hy-6}C-15 ${hy-22} 15 ${hy-22} 16 ${hy-6}Z" fill="${cloth}" ${OL}/><path d="M-16 ${hy-8}H16" stroke="${o.band||'#7A5A3A'}" stroke-width="3.5"/>`
    :`${o.long?`<path d="M-17 ${hy}C-20 ${hy+14}-16 ${hy+22}-11 ${hy+24}H11C16 ${hy+22} 20 ${hy+14} 17 ${hy}Z" fill="${hair}"/>`:''}<circle cx="0" cy="${hy}" r="16" fill="${skin}" ${OL}/><path d="M-16 ${hy-1}C-18 ${hy-22} 18 ${hy-22} 16 ${hy-1} 10 ${hy-12}-8 ${hy-12}-16 ${hy-1}Z" fill="${hair}" ${OL}/>`;

  const hsc=kid?.78:1;
  return `<g class="${cls}" ${id?`id="${id}"`:''}><g class="pb"><g transform="translate(${x} ${y}) scale(${flip?-s*hsc:s*hsc} ${s*hsc})">
    <ellipse cx="0" cy="2" rx="20" ry="3.5" fill="rgba(0,0,0,.13)"/>
    <ellipse cx="-7" cy="0" rx="7" ry="3.6" fill="#5A3E2A"/><ellipse cx="7" cy="0" rx="7" ry="3.6" fill="#5A3E2A"/>
    <path d="M-12-62C-8-66 8-66 12-62L21-2C10 2-10 2-21-2Z" fill="${robe}" ${OL}/>${sash?`<path d="M-11-60 14-20 18-24-6-60Z" fill="${sash}"/>`:''}
    <path d="M-11-57 ${A[0][0]} ${A[0][1]}M11-57 ${A[1][0]} ${A[1][1]}" stroke="#4A3526" stroke-width="11" stroke-linecap="round" fill="none"/>

    ${head}${bd}${eyes}${cheeks}</g></g></g>`;
}

let vEN=null,vFIL=null,lastLine='';
function findVoices(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices();if(!vs.length)return;
  const en=vs.filter(v=>/^en/i.test(v.lang));
  vEN=null;
  for(const re of [/female/i,/samantha|ava|allison|susan|zira|aria|jenny|libby|sonia/i,/en-us-x-(sfg|tpf|iob|iog)/i,/google us english/i]){const v=en.find(v=>re.test(v.name)||re.test(v.voiceURI));if(v){vEN=v;break}}
  if(!vEN)vEN=en.find(v=>/en[-_]US/i.test(v.lang))||en[0]||null;
  vFIL=vs.find(v=>/^(fil|tl)/i.test(v.lang))||vs.find(v=>/filipino|tagalog/i.test(v.name))||null;
}
if('speechSynthesis' in window){findVoices();speechSynthesis.onvoiceschanged=findVoices}
let pend={},seq=0;
window.__ttsDone=id=>{const f=pend[id];if(f){delete pend[id];f()}};
const talking=on=>document.body.classList.toggle('talking',on);
function speakRaw(text,vl='en'){
  return new Promise(res=>{
    const words=String(text).split(/\s+/).length, est=700+words*(vl==='fil'?470:400);
    let fin=false,to;
    const done=()=>{if(fin)return;fin=true;clearTimeout(to);talking(false);res()};
    if(!voiceOn||!text){to=setTimeout(done,Math.min(est,2400));return}
    talking(true);
    to=setTimeout(done,est*2+3000);
    if(window.AndroidTTS){
      try{
        if(AndroidTTS.speakLang){const id='u'+(++seq);pend[id]=done;AndroidTTS.speakLang(String(text),vl,id)}
        else{AndroidTTS.speak(String(text));clearTimeout(to);to=setTimeout(done,est)}
      }catch(e){done()}
      return;
    }
    if(!('speechSynthesis' in window)){clearTimeout(to);to=setTimeout(done,est);return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang=vl==='fil'?'fil-PH':'en-US';
    const v=vl==='fil'?vFIL:vEN;if(v)u.voice=v;
    u.pitch=1.35;u.rate=(vl==='fil'?.86:.92)*(window.RATE||1);
    u.onend=done;u.onerror=done;
    setTimeout(()=>{if(!fin)speechSynthesis.speak(u)},40);
  });
}
function stopVoice(){
  try{if(window.AndroidTTS&&AndroidTTS.stop)AndroidTTS.stop();else if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
  const f=Object.values(pend);pend={};f.forEach(x=>x());talking(false);
}

}

let ac;
function tone(freq,t0,dur,type='sine',vol=.18){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;
    const t=ac.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}
}

  cheer(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.4,'sine',.16))},
  magic(){[880,1175,1568,2093].forEach((f,i)=>tone(f,i*.07,.3,'sine',.1))},

const fx=$('#fx'),fctx=fx.getContext('2d');let bits=[],fxRun=false;
function confetti(n=120){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const d=devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;fctx.setTransform(d,0,0,d,0,0);
  const cols=['#FFC933','#E8484F','#2F9E55','#2D78B8','#9BD86F','#F29A1F','#8A4FBF'];
  for(let i=0;i<n;i++)bits.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4,life:120+Math.random()*60});
  if(!fxRun){fxRun=true;requestAnimationFrame(fxTick)}
}
function fxTick(){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  bits=bits.filter(b=>b.life-->0);
  for(const b of bits){b.vy+=.35;b.vx*=.99;b.x+=b.vx;b.y+=b.vy;b.a+=b.va;fctx.save();fctx.translate(b.x,b.y);fctx.rotate(b.a);fctx.fillStyle=b.c;
    if(b.r>7){fctx.beginPath();fctx.arc(0,0,b.r/2,0,7);fctx.fill()}else fctx.fillRect(-b.r/2,-b.r/4,b.r,b.r/2);fctx.restore()}
  if(bits.length)requestAnimationFrame(fxTick);else{fxRun=false;fctx.clearRect(0,0,innerWidth,innerHeight)}
}

function attachInk(el,h){
  let id=null,start,moved,drawing,downTarget;
  const pt=e=>{const r=el.getBoundingClientRect();
    const pr=e.pointerType==='pen'?(e.pressure||.5):e.pointerType==='touch'?.55:.5;
    return{x:e.clientX-r.left,y:e.clientY-r.top,p:pr,pen:e.pointerType==='pen',side:(e.buttons&2)===2||(e.buttons&32)===32}};
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen')penAt=Date.now();
    if(e.pointerType==='touch'&&penActive())return;     // palm rejection while the S Pen is in use
    if(id!==null)return;
    if(e.target.closest('button'))return;
    e.preventDefault();
    id=e.pointerId;start=pt(e);moved=false;downTarget=e.target;
    try{el.setPointerCapture(id)}catch(_){}
    drawing=h.down(start,e)!==false;
  });
  el.addEventListener('pointermove',e=>{
    if(e.pointerId!==id)return;
    if(e.pointerType==='pen')penAt=Date.now();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ce of (evs.length?evs:[e])){const p=pt(ce);if(dist(p,start)>9)moved=true;if(drawing)h.move(p,e)}
  });
  const end=e=>{
    if(e.pointerId!==id)return;id=null;const p=pt(e);
    if(drawing)h.up(p,moved,downTarget,e.type==='pointercancel');
    else if(!moved&&h.tap)h.tap(downTarget);
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function fitCanvas(c){
  const d=devicePixelRatio||1,r=c.getBoundingClientRect();
  const w=Math.round(r.width*d),hh=Math.round(r.height*d);
  if(c.width!==w||c.height!==hh){c.width=w;c.height=hh;return true}
  return false;
}
const strokeWidth=(p,base)=>p.pen?base*(.45+p.p*1.1):base;
function drawStroke(ctx,pts,color,base,alpha=1){
  if(!pts||!pts.length)return;
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineCap='round';ctx.lineJoin='round';
  if(pts.length===1){ctx.beginPath();ctx.arc(pts[0].x,pts[0].y,strokeWidth(pts[0],base)/2,0,7);ctx.fill()}
  for(let i=1;i<pts.length;i++){ctx.beginPath();ctx.lineWidth=strokeWidth(pts[i],base);ctx.moveTo(pts[i-1].x,pts[i-1].y);ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke()}
  ctx.restore();
}

/* draw-a-line matching: dots with data-key + data-side (L/R) */
function matchEngine(board,{onRight,onWrong,onDone,total}){
  const canvas=board.querySelector('canvas.ink'),ctx=canvas.getContext('2d');
  const COLS=['#E8484F','#2D78B8','#F29A1F','#8E5BD0','#2F9E55','#D35FA0'];
  let done=[],live=null,fade=null,mistakes=0;
  const anchors=()=>{const b=board.getBoundingClientRect();return[...board.querySelectorAll('.dot')].map(el=>{const r=el.getBoundingClientRect();return{el,key:el.dataset.key,side:el.dataset.side,x:r.left+r.width/2-b.left,y:r.top+r.height/2-b.top}})};
  const near=(list,p,max)=>{let best=null,bd=max;for(const a of list){const d=dist(a,p);if(d<bd){bd=d;best=a}}return best};
  function render(){
    fitCanvas(canvas);const d=devicePixelRatio||1;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
    const A=anchors();
    done.forEach((pr,i)=>{const a=A.find(x=>x.el===pr.a),b=A.find(x=>x.el===pr.b);if(!a||!b)return;
      ctx.save();ctx.strokeStyle=COLS[i%COLS.length];ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);
      ctx.quadraticCurveTo((a.x+b.x)/2,(a.y+b.y)/2-Math.min(30,Math.abs(a.x-b.x)*.08),b.x,b.y);ctx.stroke();ctx.restore()});
    if(fade)drawStroke(ctx,fade.pts,'#9AA9A0',7,fade.a);
    if(live)drawStroke(ctx,live.pts,'#2D78B8',7);
  }
  function fadeOut(pts){fade={pts,a:1};const t=()=>{if(!fade)return;fade.a-=.08;if(fade.a<=0){fade=null;render();return}render();requestAnimationFrame(t)};requestAnimationFrame(t)}
  attachInk(board,{
    down(p){const a=near(anchors().filter(a=>!a.el.classList.contains('used')),p,46);if(!a)return false;live={from:a,pts:[{...p,x:a.x,y:a.y},p]};a.el.classList.add('active');render()},
    move(p){live.pts.push(p);render()},
    up(p,moved,_t,cancel){
      const from=live.from;from.el.classList.remove('active');const pts=live.pts;live=null;
      if(cancel){render();return}
      const to=near(anchors().filter(a=>a.side!==from.side&&!a.el.classList.contains('used')),p,56);
      if(!to){fadeOut(pts);if(moved)say(L('Draw your line all the way to a dot!','Iguhit ang linya hanggang sa tuldok!'));return}
      if(to.key===from.key){from.el.classList.add('used');to.el.classList.add('used');done.push({a:from.el,b:to.el});render();sfx.ding();onRight(from.key);
        if(done.length===total)setTimeout(()=>onDone(mistakes),900)}
      else{mistakes++;to.el.classList.remove('hit');void to.el.offsetWidth;to.el.classList.add('hit');fadeOut(pts);onWrong(from.key,to.key)}
    },
    tap:speakTarget
  });
  new ResizeObserver(render).observe(board);render();
}

/* circle-to-answer: elements with .choice; onPick(el) returns true if correct */
function circleEngine(b,onPick){
  const canvas=b.querySelector('canvas.ink'),ctx=canvas.getContext('2d');
  let live=null,fade=null;
  const render=()=>{fitCanvas(canvas);const d=devicePixelRatio||1;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
    if(fade)drawStroke(ctx,fade.pts,fade.c,6,fade.a);if(live)drawStroke(ctx,live,'#E8484F',6)};
  const fadeOut=(pts,c)=>{fade={pts,a:1,c};const t=()=>{if(!fade)return;fade.a-=.07;if(fade.a<=0){fade=null;render();return}render();requestAnimationFrame(t)};requestAnimationFrame(t)};
  attachInk(b,{
    down(p){live=[p];render()},
    move(p){live.push(p);render()},
    up(p,moved,target,cancel){
      const pts=live;live=null;
      if(cancel){render();return}
      if(!moved){render();const c=target.closest&&target.closest('.choice');if(c&&!c.classList.contains('locked'))onPick(c);else speakTarget(target);return}
      const xs=pts.map(q=>q.x),ys=pts.map(q=>q.y),bx={l:Math.min(...xs),r:Math.max(...xs),t:Math.min(...ys),b:Math.max(...ys)};
      const w=bx.r-bx.l,h=bx.b-bx.t,closed=pts.length>8&&dist(pts[0],pts[pts.length-1])<Math.max(w,h)*.65;
      const br=b.getBoundingClientRect();let best=null,bs=0;
      b.querySelectorAll('.choice:not(.locked)').forEach(c=>{const r=c.getBoundingClientRect(),cx=r.left+r.width/2-br.left,cy=r.top+r.height/2-br.top;
        if(cx>bx.l-6&&cx<bx.r+6&&cy>bx.t-6&&cy<bx.b+6&&w<r.width*3.2&&h<r.height*4){const sc=1/(1+Math.abs(w-r.width)+Math.abs(h-r.height));if(sc>bs){bs=sc;best=c}}});
      if(best&&closed){const ok=onPick(best);fadeOut(pts,ok?'#E8484F':'#9AA9A0')}
      else{fadeOut(pts,'#9AA9A0');say(best?L('Close your circle all the way around!','Isara ang bilog hanggang dulo!'):L('Draw a circle around your answer!','Bilugan ang iyong sagot!'))}
    }
  });
  new ResizeObserver(render).observe(b);render();
}

/* scribble/color areas (.cpic or .bubble with a canvas inside) */
let crayon='#2F9E55',eraseMode=false;
const CRAY=['#E8484F','#F29A1F','#FFC933','#2F9E55','#2D78B8','#8E5BD0','#8B5E3C'];
function crayonBar(){
  return `<div class="crayons">${CRAY.map(c=>`<button class="crayon" style="background:${c}" data-c="${c}" aria-label="Crayon" aria-pressed="${c===crayon&&!eraseMode}"></button>`).join('')}<button class="crayon eraser" data-er="1" aria-label="Eraser" aria-pressed="${eraseMode}">${ICON.eraser}</button></div>`;
}
function bindCrayons(root){
  root.querySelectorAll('.crayon').forEach(btn=>btn.onclick=()=>{
    if(btn.dataset.er){eraseMode=true}else{crayon=btn.dataset.c;eraseMode=false}
    root.querySelectorAll('.crayon').forEach(x=>x.setAttribute('aria-pressed',x===btn));sfx.pop()});
}
function scribble(box,o){
  const cv=box.querySelector('canvas'),cx=cv.getContext('2d');let ink=0,last=null,er=false;
  const prep=()=>{fitCanvas(cv);const d=devicePixelRatio||1;cx.setTransform(d,0,0,d,0,0)};
  requestAnimationFrame(prep);
  const width=o.width||18;
  const seg=(a,b)=>{cx.save();cx.globalCompositeOperation=er?'destination-out':'source-over';cx.strokeStyle=crayon;cx.globalAlpha=er?1:.85;cx.lineCap='round';cx.lineJoin='round';
    cx.lineWidth=er?30:strokeWidth(b,width);cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();cx.restore()};
  attachInk(box,{
    down(p){if(o.can&&!o.can())return false;prep();er=eraseMode||p.side;last=p;seg(p,{...p,x:p.x+.1})},
    move(p){seg(last,p);if(!er)ink+=dist(last,p);last=p},
    up(){if(!er)o.onUp(ink)}
  });
  return{clear(){cx.save();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.restore();ink=0},
    fill(c){prep();cx.save();cx.fillStyle=c||crayon;cx.globalAlpha=.85;cx.fillRect(0,0,cv.width,cv.height);cx.restore()}};
}

/* ---- trail of levels ---- */
const NODES=[];
GROUPS.forEach((g,gi)=>{
  [...g.letters].forEach(l=>NODES.push({id:'L'+l,g:gi,label:l,name:`Letter ${l}`,acts:[['meet',l],['trace',l,1],['hunt',l],['trace',l,2],['pop',l,gi]]}));
  if(g.sight)NODES.push({id:'S'+gi,g:gi,icon:'👀',name:'Look words',acts:[['sight',g.sight]]});
  NODES.push({id:'B'+gi,g:gi,icon:'🔊',name:'Sound it out',acts:[['blend',g.blend]]});
  NODES.push({id:'P'+gi,g:gi,icon:'🔤',name:'Spell it',acts:[['spell',g.spell,gi]]});
  if(g.write)NODES.push({id:'W'+gi,g:gi,icon:'✏️',name:'Write words',acts:[['write',g.write]]});
  if(g.read)NODES.push({id:'R'+gi,g:gi,icon:'📖',name:'Read it',acts:[['read',g.read]]});
});
const learned=gi=>GROUPS.slice(0,gi+1).map(g=>g.letters).join('');
const curIndex=()=>{const i=NODES.findIndex(n=>!rs.done[n.id]);return i<0?NODES.length-1:i};
const unlocked=i=>rs.all||i<=curIndex();
function setIsl(gi){document.documentElement.style.setProperty('--isl',GROUPS[gi].color);document.documentElement.style.setProperty('--isl-soft',GROUPS[gi].soft)}

function home(){
  current='home';setIsl(NODES[curIndex()].g);
  const ci=curIndex();
  let html=`<div class="rhead"><h1>Sibol <span>Reads</span></h1>${svg('0 0 100 100',SIBOL,'big-sibol dance')}</div>
   <div class="topbtns"><button class="stickbtn" id="book">⭐ My stickers <b>${rs.stickers.length}</b></button><button class="grown" id="grown">Grown-ups (hold)</button></div>
   <div class="trail" id="trail"><svg class="road" id="road"></svg>`;
  let lastG=-1;
  NODES.forEach((n,i)=>{
    if(n.g!==lastG){lastG=n.g;const g=GROUPS[n.g];html+=`<div class="isle" style="--isl:${g.color}">${g.name}<small>${g.letters.split('').join(' ')}</small></div>`}
    const x=50+Math.sin(i*1.05)*30,st=rs.done[n.id]?'done':unlocked(i)?(i===ci?'cur':''):'locked';
    html+=`<div class="nrow"><button class="node ${st}" data-i="${i}" style="left:${x}%;--isl:${GROUPS[n.g].color}" aria-label="${n.name}">${n.icon?`<span class="ic">${n.icon}</span>`:n.label}${i===ci?svg('0 0 100 100',SIBOL,'me'):''}<span class="lbl">${n.name}</span></button></div>`;
  });
  html+=`</div><p class="ptip">Tip for grown-ups: one or two levels a day is plenty. Sit with her, say the sounds together, and cheer every try.</p>`;
  app.innerHTML=html;
  drawRoad();
  app.querySelectorAll('.node').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!unlocked(i)){sfx.oops();say('Finish the glowing level first!');return}go(()=>runNode(i))});
  $('#book').onclick=()=>go(stickerBook);
  holdButton($('#grown'),()=>go(grownUps));
  const cur=app.querySelector('.node.cur');if(cur)setTimeout(()=>cur.scrollIntoView({block:'center',behavior:'smooth'}),300);
  say(ci===0&&!rs.done[NODES[0].id]?"Hi! I'm Sibol. Let's learn to read together! Tap the glowing circle.":'Welcome back! Tap the glowing circle to play.');
}
function drawRoad(){
  const t=$('#trail'),r=t.getBoundingClientRect(),road=$('#road');
  const pts=[...t.querySelectorAll('.node')].map(n=>{const b=n.getBoundingClientRect();return[b.left+b.width/2-r.left,b.top+b.height/2-r.top]});
  if(pts.length<2)return;
  let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];d+=`C${x0} ${(y0+y1)/2} ${x1} ${(y0+y1)/2} ${x1} ${y1}`}
  road.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);
  road.innerHTML=`<path d="${d}" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" opacity=".9"/><path d="${d}" fill="none" stroke="#E9D49F" stroke-width="12" stroke-dasharray="2 16" stroke-linecap="round"/>`;
}
addEventListener('resize',()=>{if(current==='home'&&$('#trail'))drawRoad()});
function holdButton(b,fn){let t;const st=e=>{e.preventDefault();b.classList.add('hold');t=setTimeout(()=>{b.classList.remove('hold');fn()},1800)};const en=()=>{clearTimeout(t);b.classList.remove('hold')};
  b.addEventListener('pointerdown',st);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,en))}

/* ---- running a level ---- */
let lv={k:0,n:1};
function shell(line,title){
  app.innerHTML=`<div class="ashell"><button class="round" id="back" aria-label="Home">${ICON.home}</button><div class="prog">${Array.from({length:lv.n},(_,i)=>`<i class="${i<lv.k?'on':i===lv.k?'cur':''}"></i>`).join('')}</div><button class="round" id="hear" aria-label="Say it again">${ICON.speak}</button></div>${title?`<div class="atitle">${title}</div>`:''}`;
  $('#back').onclick=()=>go(home);$('#hear').onclick=()=>say(curLine);
  curLine=line;if(line)say(line);
  const box=document.createElement('div');box.className='center';app.appendChild(box);return box;
}
function runNode(i){
  const node=NODES[i],my=RUN;setIsl(node.g);
  lv={k:0,n:node.acts.length};
  const next=()=>{if(!alive(my))return;
    if(lv.k>=node.acts.length){reward(i);return}
    const [kind,...args]=node.acts[lv.k];
    ACT[kind](...args,()=>{lv.k++;sfx.ding();setTimeout(next,700)});
  };
  next();
}
function reward(i){
  const node=NODES[i],first=!rs.done[node.id];
  rs.done[node.id]=1;
  let st=null;if(first){const left=STICKERS.filter(s=>!rs.stickers.includes(s));st=left.length?pick(left):pick(STICKERS);rs.stickers.push(st)}
  saveRs();sfx.cheer();confetti(160);
  app.innerHTML=`<div class="reward">${svg('0 0 100 100',SIBOL,'big-sibol dance')}<h2>${pick(['You did it!','Amazing!','Super reader!','Hooray!'])}</h2>
   ${st?`<p style="font-size:20px">You earned a sticker! Tap the card.</p><button class="scard" id="sc"><div class="in"><div class="f">?</div><div class="b">${st}</div></div></button>`:`<p style="font-size:20px">Great practice!</p>`}
   <button class="bigbtn" id="cont">Keep going!</button></div>`;
  if(st)$('#sc').onclick=()=>{$('#sc').classList.add('flip');sfx.magic();confetti(80)};
  $('#cont').onclick=()=>go(home);
  say(st?'You did it! You earned a new sticker! Tap the card to see it.':'Great practice! You are getting better and better.');
}

   <div class="taps">${[0,1,2].map(()=>'<i></i>').join('')}</div><button class="bigbtn" id="go" disabled>Next</button>`;
  $('#bl').onclick=()=>{sfx.pop();$('#bl').style.animation='none';void $('#bl').offsetWidth;$('#bl').style.animation='';speakRaw(`${s}!`);

  $('#pk').onclick=()=>speakRaw(`${kw}. ${s}, ${kw}.`);

function tracer(host,l,level,onDone,o={}){
  const wrap=document.createElement('div');wrap.className='tracer'+(o.small?' small':'');
  const guideW=level===1?13:11,dash=level===1;
  wrap.innerHTML=`<svg viewBox="0 0 100 140"><path d="M4 10H96M4 100H96" stroke="#9FB8D8" stroke-width="1.2"/><path d="M4 50H96" stroke="#E8A3A6" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M4 135H96" stroke="#DCE6EE" stroke-width="1"/>
    <g class="gd"></g><g class="fl"></g><g class="hint"></g></svg><canvas></canvas>`;
  host.appendChild(wrap);
  const S=wrap.querySelector('svg'),gd=S.querySelector('.gd'),fl=S.querySelector('.fl'),hint=S.querySelector('.hint'),cv=wrap.querySelector('canvas'),cx=cv.getContext('2d');
  const NS='http://www.w3.org/2000/svg';
  const strokes=STROKES[l].map(d=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',level===1?'#D9E3EA':'#EDF2F5');p.setAttribute('stroke-width',guideW);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');gd.appendChild(p);
    if(dash){const q=p.cloneNode();q.setAttribute('stroke','#9AAAB6');q.setAttribute('stroke-width','1.6');q.setAttribute('stroke-dasharray','3 4');gd.appendChild(q)}
    const L=p.getTotalLength(),n=Math.max(2,Math.ceil(L/4));const pts=[];for(let i=0;i<=n;i++){const q=p.getPointAtLength(L*i/n);pts.push({x:q.x,y:q.y})}return{d,L,pts}});
  let cur=0,cov=new Set(),live=[],miss=0;
  const geo=()=>{const r=wrap.getBoundingClientRect();const s=Math.min(r.width/100,r.height/140);return{s,ox:(r.width-100*s)/2,oy:(r.height-140*s)/2}};
  const toPx=(p,g)=>({x:g.ox+p.x*g.s,y:g.oy+p.y*g.s});
  function showStart(){
    const st=strokes[cur];if(!st){hint.innerHTML='';return}
    const a=st.pts[0],b=st.pts[Math.min(3,st.pts.length-1)];const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
    hint.innerHTML=`<circle cx="${a.x}" cy="${a.y}" r="7" fill="#2F9E55" stroke="#fff" stroke-width="2"><animate attributeName="r" values="6;8.5;6" dur="1.2s" repeatCount="indefinite"/></circle>
      ${st.L>3?`<path d="M0-4 8 0 0 4Z" fill="#fff" transform="translate(${a.x} ${a.y}) rotate(${ang})"/>`:''}
      ${level===1&&st.L>3?`<circle r="4.5" fill="#FFC933" stroke="#B98A00" stroke-width="1"><animateMotion path="${st.d}" dur="${Math.max(1.4,st.L/60)}s" repeatCount="indefinite"/></circle>`:''}`;
  }
  function render(){fitCanvas(cv);const d=devicePixelRatio||1;cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,cv.width,cv.height);const g=geo();drawStroke(cx,live,'#8A4FBF',g.s*7)}
  function mark(p){const g=geo(),tol=g.s*11;strokes[cur].pts.forEach((q,i)=>{if(!cov.has(i)&&dist(toPx(q,g),p)<tol)cov.add(i)})}
  attachInk(wrap,{
    down(p){if(!strokes[cur])return false;const g=geo();
      if(dist(toPx(strokes[cur].pts[0],g),p)>g.s*20&&strokes[cur].L>3){sfx.oops();say('Start at the green dot!',{cap:false});return false}
      live=[p];mark(p);render()},
    move(p){live.push(p);mark(p);render()},
    up(p,moved,t,cancel){
      const st=strokes[cur],n=st.pts.length,ok=cov.size/n>=.8&&cov.has(n-1);
      live=[];render();
      if(ok&&!cancel){const q=document.createElementNS(NS,'path');q.setAttribute('d',st.d);q.setAttribute('fill','none');q.setAttribute('stroke',getComputedStyle(document.documentElement).getPropertyValue('--isl')||'#2F9E55');q.setAttribute('stroke-width','9');q.setAttribute('stroke-linecap','round');q.setAttribute('stroke-linejoin','round');fl.appendChild(q);
        sfx.pop();cur++;cov=new Set();miss=0;showStart();
        if(cur>=strokes.length){hint.innerHTML=sparkles(50,75);onDone()}}
      else{cov=new Set();miss++;say(miss>1?'Watch the yellow dot, then follow the dotted line from the green dot.':'Almost! Follow the dotted line all the way.',{cap:false})}
    }
  });
  showStart();new ResizeObserver(render).observe(wrap);
}
ACT.trace=(l,level,done)=>{
  const box=shell(level===1?`Let's write ${l}! Watch the yellow dot, then trace with your pen from the green dot.`:`Now write ${l} again, all by yourself!`,`Write <span style="color:var(--isl)">${l}</span>`);
  tracer(box,l,level,()=>{say(`${praise()} That's ${l}! ${snd(l)}!`);setTimeout(done,1600)});
};
ACT.hunt=(l,done)=>{
  const g=Object.keys(LET).indexOf(l);let round=0;
  const others=Object.keys(LET).filter(k=>k!==l&&k!=='q'&&k!=='x'&&LET[k][0]!==LET[l][0]);
  const box=shell(null,'Which one starts with…');
  const play=()=>{
    const want=round===0?[LET[l][1],LET[l][2]]:[LET[l][3],LET[l][4]];
    const opts=shuffle([want,...shuffle(others).slice(0,2).map(k=>[LET[k][1],LET[k][2]])]);let wrong=0;
    const q=l==='x'?`Which one ends with ${snd(l)}? Like box!`:`Which one starts with ${snd(l)}? ${snd(l)}.`;
    box.innerHTML=`<button class="saybig" id="sb">${ICON.speak}</button><div class="atitle" style="font-size:44px;color:var(--isl)">${l}</div><div class="cards3">${opts.map(([w,e])=>`<button class="pcard3" data-w="${w}"><span class="emo">${e}</span><span>${w}</span></button>`).join('')}</div>`;
    curLine=q;say(q);$('#sb').onclick=()=>say(q);
    box.querySelectorAll('.pcard3').forEach(c=>c.onclick=()=>{
      if(c.dataset.w===want[0]){c.classList.add('ok');sfx.ding();say(`${praise()} ${want[0]}! ${snd(l)}, ${want[0]}.`);round++;setTimeout(()=>round<2?play():done(),2000)}
      else{c.classList.remove('no');void c.offsetWidth;c.classList.add('no');sfx.oops();wrong++;
        say(`That's ${c.dataset.w}. Listen: ${snd(l)}. ${wrong>1?'Look for the glowing one!':'Try again!'}`);
        if(wrong>1)box.querySelector(`[data-w="${want[0]}"]`).classList.add('hintme')}
    });
  };
  play();
};
ACT.pop=(l,gi,done)=>{
  const pool=[...new Set((learned(gi)).split(''))].filter(k=>k!==l);
  const box=shell(`Pop the balloons with ${l}! ${snd(l)}!`,`Pop every <span style="color:var(--isl)">${l}</span>`);
  box.innerHTML=`<div class="score" id="sc">${'⚪'.repeat(5)}</div><div class="popzone" id="pz"></div>`;
  const pz=$('#pz'),my=RUN,cols=['#E8484F','#2D78B8','#F29A1F','#8A4FBF','#2F9E55','#D35FA0'];let got=0,n=0,over=false;
  const spawn=()=>{if(!alive(my)||over)return;
    const isT=n%2===0||Math.random()<.35;n++;const ch=isT?l:pick(pool.length?pool:['o']);
    const b=document.createElement('button');b.className='balloon';b.textContent=ch;b.dataset.c=ch;
    b.style.left=(6+Math.random()*68)+'%';b.style.background=pick(cols);b.style.animationDuration=(6+Math.random()*2.5)/(rs.slow?.8:1)+'s';
    b.addEventListener('animationend',e=>{if(e.animationName==='rise')b.remove()});
    b.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&penActive())return;if(b.classList.contains('popped'))return;
      if(ch===l){b.classList.add('popped');tone(500+got*80,0,.12,'square',.08);got++;$('#sc').textContent='🟢'.repeat(got)+'⚪'.repeat(Math.max(0,5-got));speakRaw(snd(l));
        if(got>=5){over=true;setTimeout(()=>{say(`${praise()} You popped five ${l} balloons!`);setTimeout(done,1400)},400)}}
      else{b.classList.add('nope');sfx.oops();say(`That's ${ch}. Find ${l}!`,{cap:false})}
      setTimeout(()=>{if(b.classList.contains('popped'))b.remove()},320)});
    pz.appendChild(b);setTimeout(spawn,rs.slow?1500:1150);
  };
  setTimeout(spawn,1200);
};
ACT.blend=(words,done)=>{
  let wi=0;const box=shell(null,'Sound it out');
  const play=()=>{
    const w=words[wi],letters=[...w];let heard=new Set(),wrong=0;
    const others=shuffle(Object.keys(WORDPIC).filter(x=>x!==w)).slice(0,2);
    box.innerHTML=`<div class="tiles">${letters.map((c,i)=>`<button class="tile" data-i="${i}">${c}</button>`).join('')}</div>
      <div class="slider" id="sl" hidden><div class="knob">▶</div><span>Slide to read!</span></div><div id="pickw" class="cards3" hidden>${shuffle([w,...others]).map(x=>`<button class="pcard3" data-w="${x}"><span class="emo">${WORDPIC[x]}</span></button>`).join('')}</div>`;
    curLine='Tap each letter to hear its sound.';say(`Word ${wi+1}. Tap each letter to hear its sound.`);
    box.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const c=letters[t.dataset.i];t.classList.add('heard');speakRaw(snd(c));heard.add(t.dataset.i);
      if(heard.size===letters.length&&$('#sl').hidden){$('#sl').hidden=false;curLine='Now slide the green button to blend the sounds!';say(curLine)}});
    const sl=$('#sl'),kn=sl.querySelector('.knob');let sliding=false,lit=-1;
    attachInk(sl,{down(p){sliding=true;return true},move(p){const r=sl.getBoundingClientRect(),x=Math.max(0,Math.min(r.width-60,p.x-30));kn.style.left=(x+4)+'px';
        const k=Math.min(letters.length-1,Math.floor(x/(r.width-60)*letters.length));if(k!==lit){lit=k;box.querySelectorAll('.tile').forEach((t,i)=>t.classList.toggle('glow',i===k));tone(400+k*120,0,.1,'sine',.08)}},
      up(){const r=sl.getBoundingClientRect(),x=parseFloat(kn.style.left||0);box.querySelectorAll('.tile').forEach(t=>t.classList.remove('glow'));lit=-1;
        if(x>r.width*.6){speakRaw(`${letters.map(snd).join('... ')}... ${w}!`).then(()=>{if(!$('#pickw'))return;$('#pickw').hidden=false;curLine=`${w}. Which picture is ${w}?`;say(curLine)})}
        kn.style.left='4px'}});
    box.querySelectorAll('#pickw .pcard3').forEach(c=>c.onclick=()=>{
      if(c.dataset.w===w){c.classList.add('ok');sfx.ding();say(`${praise()} ${w}!`);wi++;setTimeout(()=>wi<words.length?play():done(),1700)}
      else{c.classList.remove('no');void c.offsetWidth;c.classList.add('no');sfx.oops();wrong++;say(`Listen again: ${w}.`);if(wrong>1)box.querySelector(`#pickw [data-w="${w}"]`).classList.add('hintme')}
    });
  };
  play();
};
ACT.spell=(words,gi,done)=>{
  let wi=0;const box=shell(null,'Spell it');
  const pool=learned(gi).split('');
  const play=()=>{
    const w=words[wi];let pos=0,wrong=0;
    const extra=shuffle(pool.filter(c=>!w.includes(c))).slice(0,2);
    box.innerHTML=`<button class="pcard3" id="pw" style="width:160px"><span class="emo">${WORDPIC[w]}</span></button><div class="slots">${[...w].map(()=>'<div class="slot"></div>').join('')}</div>
      <div class="ltiles">${shuffle([...w,...extra]).map(c=>`<button class="ltile">${c}</button>`).join('')}</div>`;
    const slots=[...box.querySelectorAll('.slot')];slots[0].classList.add('cur');
    const ask=()=>{curLine=`${w}. ${[...w].map(snd).join(', ')}. What sound comes ${pos===0?'first':'next'}?`;say(curLine)};
    ask();$('#pw').onclick=()=>speakRaw(w);
    box.querySelectorAll('.ltile').forEach(t=>t.onclick=()=>{
      if(t.disabled)return;
      if(t.textContent===w[pos]){t.disabled=true;speakRaw(snd(w[pos]));slots[pos].textContent=w[pos];slots[pos].classList.remove('cur');slots[pos].classList.add('full');pos++;wrong=0;box.querySelectorAll('.ltile').forEach(x=>x.classList.remove('hintme'));
        if(pos===w.length){sfx.ding();setTimeout(()=>say(`${praise()} ${[...w].join(' ')}, ${w}!`),400);wi++;setTimeout(()=>wi<words.length?play():done(),2400)}else slots[pos].classList.add('cur')}
      else{t.classList.remove('no');void t.offsetWidth;t.classList.add('no');sfx.oops();wrong++;
        say(`That says ${snd(t.textContent)}. We need ${snd(w[pos])}.`,{cap:false});
        if(wrong>1){const h=[...box.querySelectorAll('.ltile')].find(x=>!x.disabled&&x.textContent===w[pos]);if(h)h.classList.add('hintme')}}
    });
  };
  play();
};
ACT.write=(words,done)=>{
  let wi=0;const box=shell(null,'Write the word');
  const play=()=>{
    const w=words[wi];let li=0;box.innerHTML=`<div class="emo">${WORDPIC[w]}</div><div class="wordtrace" id="wt"></div>`;
    curLine=`Let's write ${w}. ${[...w].join(', ')}. Trace each letter.`;say(curLine);
    const host=$('#wt');
    const nextLetter=()=>{if(li>=w.length){say(`${praise()} You wrote ${w}!`);wi++;setTimeout(()=>wi<words.length?play():done(),1800);return}
      const c=w[li++];tracer(host,c,li===1?1:2,()=>{speakRaw(snd(c));setTimeout(nextLetter,500)},{small:true})};
    nextLetter();
  };
  play();
};
ACT.sight=(words,done)=>{
  let wi=0;const box=shell(null,'Look words');
  const play=()=>{
    const w=words[wi];const grid=shuffle([w,w,w,...shuffle(['I','a','the','see','is','can','my','on','to','it','in','at'].filter(x=>x!==w)).slice(0,6)]);let found=0;
    box.innerHTML=`<p style="font-size:20px">We know this word just by looking!</p><button class="bigL" id="sw" style="font-size:clamp(70px,22vw,120px);padding:6px 30px">${w}</button><div class="wordgrid">${grid.map(x=>`<button class="wbtn" data-w="${x}">${x}</button>`).join('')}</div>`;
    curLine=`This word is ${w}. Find all three ${w} words!`;say(curLine);$('#sw').onclick=()=>speakRaw(w);
    box.querySelectorAll('.wbtn').forEach(b=>b.onclick=()=>{
      if(b.classList.contains('ok'))return;
      if(b.dataset.w===w){b.classList.add('ok');tone(600+found*120,0,.15);speakRaw(w);found++;if(found===3){say(`${praise()} That word is ${w}!`);wi++;setTimeout(()=>wi<words.length?play():done(),1700)}}
      else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');sfx.oops();say(`That word is ${b.dataset.w}. Find ${w}!`,{cap:false})}
    });
  };
  play();
};
ACT.read=(sents,done)=>{
  let si=0;const box=shell(null,'Read it!');
  const play=()=>{
    const [s,ok,bad]=sents[si],ws=s.split(' ');let heard=new Set(),wrong=0;
    box.innerHTML=`<div class="sentbox">${ws.map((x,i)=>`<button class="sw" data-i="${i}">${x}</button>`).join('')}</div>
      <button class="pill" id="rtm">${ICON.speak} Read to me</button><div class="cards2" id="pk" hidden>${shuffle([ok,bad]).map(e=>`<button class="pcard3" data-e="${e}"><span class="emo">${e}</span></button>`).join('')}</div>`;
    curLine='Tap each word and read it with me.';say(curLine);
    const showPick=()=>{if(!$('#pk').hidden)return;$('#pk').hidden=false;curLine='Which picture matches the sentence?';say(curLine)};
    box.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{b.classList.add('heard');speakRaw(b.textContent.replace(/[.]/,''));heard.add(b.dataset.i);if(heard.size===ws.length)setTimeout(showPick,900)});
    $('#rtm').onclick=async()=>{const my=RUN;const els=[...box.querySelectorAll('.sw')];for(const e of els){if(!alive(my))return;e.classList.add('on');await speakRaw(e.textContent.replace(/[.]/,''));e.classList.remove('on');e.classList.add('heard')}heard=new Set(els.map(e=>e.dataset.i));showPick()};
    box.querySelectorAll('#pk .pcard3').forEach(c=>c.onclick=()=>{
      if(c.dataset.e===ok){c.classList.add('ok');sfx.ding();say(`${praise()} ${s}`);si++;setTimeout(()=>si<sents.length?play():done(),2400)}
      else{c.classList.remove('no');void c.offsetWidth;c.classList.add('no');sfx.oops();wrong++;say(`Read it again: ${s}`);if(wrong>1)box.querySelector(`#pk [data-e="${ok}"]`).classList.add('hintme')}
    });
  };
  play();
};

/* ---- sticker book + grown-ups ---- */
function stickerBook(){
  current='screen';
  app.innerHTML=`<div class="ashell"><button class="round" id="back">${ICON.home}</button><div class="atitle" style="flex:1">My stickers</div></div>
   <div class="book">${STICKERS.map(s=>rs.stickers.includes(s)?`<div>${s}</div>`:`<div class="empty">?</div>`).join('')}</div>`;
  $('#back').onclick=()=>go(home);
  say(rs.stickers.length?`You have ${rs.stickers.length} stickers! Keep reading to get more!`:'Finish a level to get your first sticker!');
}
function grownUps(){
  current='screen';
  const nd=Object.keys(rs.done).length;
  app.innerHTML=`<div class="ashell"><button class="round" id="back">${ICON.home}</button><div class="atitle" style="flex:1">Grown-ups</div></div>
   <div class="gpanel"><div class="card"><b>Progress</b><p>${nd} of ${NODES.length} levels done · ${rs.stickers.length} stickers</p></div>
   <div class="card"><b>Voice speed</b><div class="seg"><button data-s="0" aria-pressed="${!rs.slow}">Normal</button><button data-s="1" aria-pressed="${!!rs.slow}">Slower</button></div></div>
   <div class="card"><b>Levels</b><p>Open every level so she can practice anything, or start over from the beginning.</p>
    <div class="row"><button class="pill" id="all">${rs.all?'Lock levels again':'Open all levels'}</button><button class="pill" id="reset">Start over</button></div></div>
   <div class="card"><b>Helping a slow reader</b><ul style="margin:0;padding-left:20px"><li>Short and happy: 10–15 minutes, then stop while it's still fun.</li><li>Say the sounds out loud together, and let her copy the voice.</li><li>Repeat levels. Replaying a done level is great practice.</li><li>Praise effort (“You kept trying!”), not just right answers.</li><li>If she struggles a lot with letters or sounds, ask her teacher or doctor about a reading check-up.</li></ul></div></div>`;
  $('#back').onclick=()=>go(home);
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{rs.slow=b.dataset.s==='1';window.RATE=rs.slow?.82:1;try{if(window.AndroidTTS&&AndroidTTS.setRate)AndroidTTS.setRate(window.RATE)}catch(e){}saveRs();grownUps();say('This is how I will talk.')});
  $('#all').onclick=()=>{rs.all=!rs.all;saveRs();grownUps()};
  $('#reset').onclick=e=>{if(e.currentTarget.dataset.sure){rs={done:{},stickers:[],slow:rs.slow};saveRs();go(home)}else{e.currentTarget.dataset.sure=1;e.currentTarget.textContent='Tap again to erase progress'}};
}
try{if(window.AndroidTTS&&AndroidTTS.setRate)AndroidTTS.setRate(window.RATE)}catch(e){}

go(home);

$('#sib').innerHTML=SIBOL;$('#replay').innerHTML=ICON.speak;
